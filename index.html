<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For Mom ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.7.0/vanilla-tilt.min.js"></script>

<style>

/* =========================
   RESET
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    font-family:'Poppins',sans-serif;

    background:#050816;

    overflow-x:hidden;

    color:white;
}

/* =========================
   BACKGROUND
========================= */

canvas{

    position:fixed;

    top:0;
    left:0;

    width:100%;
    height:100%;

    z-index:-5;
}

.stars{

    position:fixed;

    width:200%;
    height:200%;

    background:
    url('https://www.transparenttextures.com/patterns/stardust.png');

    animation:
    moveStars 150s linear infinite;

    opacity:0.4;

    z-index:-4;
}

@keyframes moveStars{

    from{
        transform:translate(0,0);
    }

    to{
        transform:translate(-500px,-500px);
    }
}

/* =========================
   GLOW EFFECTS
========================= */

.glow{

    position:fixed;

    border-radius:50%;

    filter:blur(120px);

    opacity:0.35;

    z-index:-3;
}

.glow1{

    width:400px;
    height:400px;

    background:#ff4ecd;

    top:-100px;
    left:-100px;
}

.glow2{

    width:500px;
    height:500px;

    background:#4e7dff;

    bottom:-120px;
    right:-120px;
}

.glow3{

    width:350px;
    height:350px;

    background:#00d4ff;

    top:40%;
    left:45%;
}

/* =========================
   HERO
========================= */

.hero{

    min-height:100vh;

    display:flex;

    justify-content:center;
    align-items:center;

    flex-direction:column;

    text-align:center;

    padding:20px;
}

.hero h1{

    font-size:
    clamp(2.8rem,8vw,7rem);

    font-weight:800;

    line-height:1.2;

    background:
    linear-gradient(
    135deg,
    #ffffff,
    #ffc0cb,
    #ffd8c0);

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;

    text-shadow:
    0 0 20px rgba(255,255,255,0.3);
}

.hero p{

    margin-top:20px;

    letter-spacing:6px;

    color:#d9ddff;

    font-size:
    clamp(0.9rem,2vw,1.3rem);
}

/* =========================
   MEMORY SECTION
========================= */

.memory-section{

    width:100%;

    padding:50px 20px 100px;
}

/* =========================
   RESPONSIVE GRID
========================= */

.gallery-grid{

    max-width:1600px;

    margin:auto;

    display:grid;

    grid-template-columns:
    repeat(4,1fr);

    gap:30px;

    justify-items:center;
}

/* =========================
   CARD
========================= */

.memory-card{

    width:100%;

    max-width:300px;

    height:400px;

    border-radius:28px;

    overflow:hidden;

    position:relative;

    background:
    rgba(255,255,255,0.08);

    border:
    1px solid rgba(255,255,255,0.1);

    backdrop-filter:blur(10px);

    box-shadow:
    0 15px 40px rgba(0,0,0,0.5);

    transition:0.5s ease;

    animation:
    floatCard 5s ease-in-out infinite;
}

.memory-card:hover{

    transform:
    translateY(-15px)
    scale(1.03);

    box-shadow:
    0 0 50px rgba(255,192,203,0.5);
}

.memory-card img{

    width:100%;
    height:100%;

    object-fit:cover;
}

/* =========================
   OVERLAY
========================= */

.overlay{

    position:absolute;

    inset:0;

    background:
    linear-gradient(
    to top,
    rgba(0,0,0,0.9),
    transparent 60%);

    display:flex;

    align-items:flex-end;

    padding:20px;
}

.overlay h2{

    font-size:1.5rem;

    font-weight:700;
}

/* =========================
   FLOAT
========================= */

@keyframes floatCard{

    0%{
        transform:translateY(0px);
    }

    50%{
        transform:translateY(-10px);
    }

    100%{
        transform:translateY(0px);
    }
}

/* =========================
   FOOTER
========================= */

.footer{

    padding:100px 20px;

    text-align:center;
}

.footer h2{

    font-size:
    clamp(2rem,5vw,4rem);

    line-height:1.5;
}

/* =========================
   LAPTOP
========================= */

@media(max-width:1200px){

    .gallery-grid{

        grid-template-columns:
        repeat(3,1fr);
    }
}

/* =========================
   TABLET
========================= */

@media(max-width:900px){

    .gallery-grid{

        grid-template-columns:
        repeat(2,1fr);
    }

    .memory-card{

        height:350px;
    }
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    .hero{

        min-height:80vh;
    }

    .hero h1{

        font-size:2.7rem;
    }

    .hero p{

        letter-spacing:3px;
    }

    .gallery-grid{

        grid-template-columns:1fr;

        gap:25px;
    }

    .memory-card{

        max-width:340px;

        width:100%;

        height:420px;
    }

    .overlay h2{

        font-size:1.3rem;
    }
}

</style>

</head>

<body>

<!-- BACKGROUND -->

<canvas id="bg"></canvas>

<div class="stars"></div>

<div class="glow glow1"></div>
<div class="glow glow2"></div>
<div class="glow glow3"></div>

<!-- HERO -->

<section class="hero">

    <h1>
        Everything I am,<br>
        I owe to you.
    </h1>

    <p>TO MY UNIVERSE ❤️</p>

</section>

<!-- GALLERY -->

<section class="memory-section">

<div class="gallery-grid">

    <div class="memory-card">
        <img src="photo1.jpeg">
        <div class="overlay">
            <h2>Beautiful Memories</h2>
        </div>
    </div>

    <div class="memory-card">
        <img src="photo2.jpeg">
        <div class="overlay">
            <h2>Forever Love</h2>
        </div>
    </div>

    <div class="memory-card">
        <img src="photo3.jpeg">
        <div class="overlay">
            <h2>My Happiness</h2>
        </div>
    </div>

    <div class="memory-card">
        <img src="photo4.jpeg">
        <div class="overlay">
            <h2>My Strength</h2>
        </div>
    </div>

    <div class="memory-card">
        <img src="photo5.jpeg">
        <div class="overlay">
            <h2>Pure Love</h2>
        </div>
    </div>

    <div class="memory-card">
        <img src="photo6.jpeg">
        <div class="overlay">
            <h2>Endless Care</h2>
        </div>
    </div>

    <div class="memory-card">
        <img src="photo7.jpeg">
        <div class="overlay">
            <h2>Sweet Moments</h2>
        </div>
    </div>

    <div class="memory-card">
        <img src="photo8.jpeg">
        <div class="overlay">
            <h2>My World</h2>
        </div>
    </div>

    <div class="memory-card">
        <img src="photo9.jpeg">
        <div class="overlay">
            <h2>Always Together</h2>
        </div>
    </div>

    <div class="memory-card">
        <img src="photo10.jpeg">
        <div class="overlay">
            <h2>Infinite Love</h2>
        </div>
    </div>

    <div class="memory-card">
        <img src="photo11.jpeg">
        <div class="overlay">
            <h2>My Universe</h2>
        </div>
    </div>

</div>

</section>

<!-- FOOTER -->

<section class="footer">

<h2>
Thank you for every smile,<br>
every sacrifice,<br>
and every moment of love ❤️
</h2>

</section>

<script>

/* =========================
   PARTICLES
========================= */

const canvas =
document.getElementById("bg");

const ctx =
canvas.getContext("2d");

canvas.width =
window.innerWidth;

canvas.height =
window.innerHeight;

const particles = [];

const colors = [

"#ff9a9e",
"#fad0c4",
"#fbc2eb",
"#a18cd1",
"#84fab0",
"#8fd3f4"

];

class Particle{

    constructor(){

        this.x =
        Math.random()*canvas.width;

        this.y =
        Math.random()*canvas.height;

        this.size =
        Math.random()*3+1;

        this.speedX =
        (Math.random()-0.5)*0.8;

        this.speedY =
        (Math.random()-0.5)*0.8;

        this.color =
        colors[Math.floor(
        Math.random()*colors.length)];

        this.opacity =
        Math.random()*0.8+0.2;
    }

    update(){

        this.x += this.speedX;
        this.y += this.speedY;

        if(this.x < 0)
        this.x = canvas.width;

        if(this.x > canvas.width)
        this.x = 0;

        if(this.y < 0)
        this.y = canvas.height;

        if(this.y > canvas.height)
        this.y = 0;
    }

    draw(){

        ctx.beginPath();

        ctx.arc(
        this.x,
        this.y,
        this.size,
        0,
        Math.PI*2);

        ctx.fillStyle =
        this.color;

        ctx.globalAlpha =
        this.opacity;

        ctx.fill();
    }
}

function initParticles(){

    for(let i=0;i<500;i++){

        particles.push(
        new Particle());
    }
}

function animate(){

    ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height);

    particles.forEach((particle)=>{

        particle.update();
        particle.draw();
    });

    requestAnimationFrame(animate);
}

window.addEventListener(
"resize",
()=>{

    canvas.width =
    window.innerWidth;

    canvas.height =
    window.innerHeight;
});

/* TILT */

VanillaTilt.init(

document.querySelectorAll(".memory-card"),

{
    max:10,
    speed:400,
    glare:true,
    "max-glare":0.2
});

/* ANIMATION */

gsap.from(".hero h1",{

    opacity:0,
    y:80,
    duration:1.5
});

gsap.from(".hero p",{

    opacity:0,
    y:40,
    duration:1.5,
    delay:0.3
});

gsap.from(".memory-card",{

    opacity:0,
    y:100,
    duration:1,
    stagger:0.1
});

/* START */

initParticles();
animate();

</script>

</body>
</html>

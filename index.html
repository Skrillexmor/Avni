<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For Mom - Interactive Universe</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.7.0/vanilla-tilt.min.js"></script>

<style>

/* =========================
   RESET
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    min-height:100%;
    overflow-x:hidden;
    font-family:Arial,sans-serif;
    background:black;
    color:white;
}

/* =========================
   GALAXY BACKGROUND
========================= */

body{
    background:
    radial-gradient(circle at top left,
    #1b2735 0%,
    #090a0f 40%,
    #000000 100%);
}

#nebula-bg{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    z-index:-5;

    filter:
    blur(1px)
    brightness(1.5)
    contrast(1.4);
}

/* =========================
   MOVING STARS
========================= */

.stars{
    position:fixed;
    top:0;
    left:0;
    width:200%;
    height:200%;

    background:
    url('https://www.transparenttextures.com/patterns/stardust.png');

    animation:moveStars 120s linear infinite;

    opacity:0.5;

    z-index:-4;
}

@keyframes moveStars{

    from{
        transform:translate(0,0);
    }

    to{
        transform:translate(-500px,-500px);
    }
}

/* =========================
   GLOW EFFECTS
========================= */

.glow{
    position:fixed;
    border-radius:50%;
    filter:blur(120px);
    opacity:0.3;
    z-index:-3;

    animation:floatGlow 15s infinite alternate ease-in-out;
}

.glow1{
    width:350px;
    height:350px;
    background:#ff7eb3;
    top:-100px;
    left:-100px;
}

.glow2{
    width:450px;
    height:450px;
    background:#6a5acd;
    bottom:-150px;
    right:-150px;
}

.glow3{
    width:300px;
    height:300px;
    background:#00c9ff;
    top:40%;
    left:40%;
}

@keyframes floatGlow{

    0%{
        transform:translate(0,0);
    }

    100%{
        transform:translate(50px,30px);
    }
}

/* =========================
   MAIN CONTAINER
========================= */

.container{
    position:relative;
    width:100%;
    min-height:100vh;
    padding:40px 20px;
}

/* =========================
   HEADER
========================= */

.header{
    position:relative;
    z-index:10;
    text-align:center;
    margin-bottom:60px;
    padding-top:20px;
}

.header h1{

    font-size:clamp(2.5rem,7vw,5rem);
    line-height:1.2;

    background:
    linear-gradient(
    135deg,
    #ffffff,
    #fbc2eb,
    #fad0c4);

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;

    text-shadow:
    0 0 20px rgba(255,255,255,0.5);

    animation:fadeText 2s ease;
}

.subtitle{

    margin-top:20px;

    font-size:clamp(0.8rem,2vw,1.2rem);

    letter-spacing:8px;

    color:#d1d1f0;

    animation:fadeText 3s ease;
}

@keyframes fadeText{

    from{
        opacity:0;
        transform:translateY(50px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* =========================
   RESPONSIVE IMAGE GRID
========================= */

.slideshow{

    width:100%;

    display:grid;

    grid-template-columns:
    repeat(auto-fit,minmax(220px,1fr));

    gap:40px;

    justify-items:center;

    align-items:center;

    position:relative;

    z-index:5;

    padding:40px 10px 80px;
}

/* =========================
   IMAGE CARD
========================= */

.slide{

    width:100%;
    max-width:260px;
    aspect-ratio:1/1;

    border-radius:50%;
    overflow:hidden;

    position:relative;

    border:4px solid rgba(255,255,255,0.15);

    background:rgba(255,255,255,0.05);

    backdrop-filter:blur(10px);

    box-shadow:
    0 10px 40px rgba(0,0,0,0.7),
    0 0 30px rgba(255,255,255,0.2);

    transition:
    transform 0.5s ease,
    box-shadow 0.5s ease;

    animation:
    floatAnimation 6s ease-in-out infinite,
    pulseGlow 4s ease-in-out infinite;
}

.slide img{

    width:100%;
    height:100%;
    object-fit:cover;
}

.slide:hover{

    transform:
    scale(1.08);

    box-shadow:
    0 0 60px rgba(255,192,203,0.9),
    0 0 120px rgba(255,255,255,0.5);
}

/* =========================
   ANIMATIONS
========================= */

@keyframes floatAnimation{

    0%{
        transform:translateY(0px);
    }

    50%{
        transform:translateY(-15px);
    }

    100%{
        transform:translateY(0px);
    }
}

@keyframes pulseGlow{

    0%{
        box-shadow:
        0 0 20px rgba(255,255,255,0.2);
    }

    50%{
        box-shadow:
        0 0 50px rgba(255,192,203,0.7);
    }

    100%{
        box-shadow:
        0 0 20px rgba(255,255,255,0.2);
    }
}

/* =========================
   MOBILE RESPONSIVE
========================= */

@media(max-width:768px){

    .container{
        padding:20px 10px;
    }

    .slideshow{

        grid-template-columns:
        repeat(2,1fr);

        gap:25px;
    }

    .slide{

        max-width:160px;
    }

    .subtitle{

        letter-spacing:4px;
    }
}

@media(max-width:480px){

    .header{
        margin-bottom:30px;
    }

    .slideshow{

        grid-template-columns:1fr;
    }

    .slide{

        max-width:220px;
    }

    .glow1,
    .glow2,
    .glow3{

        opacity:0.2;
    }
}

</style>
</head>

<body>

<!-- BACKGROUND -->
<canvas id="nebula-bg"></canvas>

<div class="stars"></div>

<div class="glow glow1"></div>
<div class="glow glow2"></div>
<div class="glow glow3"></div>

<!-- MAIN -->
<div class="container">

    <!-- HEADER -->
    <div class="header">

        <h1>
            Everything I am,<br>
            I owe to you.
        </h1>

        <div class="subtitle">
            TO MY UNIVERSE
        </div>

    </div>

    <!-- RESPONSIVE IMAGE GRID -->
    <div class="slideshow">

        <div class="slide"><img src="photo1.jpeg"></div>
        <div class="slide"><img src="photo2.jpeg"></div>
        <div class="slide"><img src="photo3.jpeg"></div>
        <div class="slide"><img src="photo4.jpeg"></div>
        <div class="slide"><img src="photo5.jpeg"></div>
        <div class="slide"><img src="photo6.jpeg"></div>
        <div class="slide"><img src="photo7.jpeg"></div>
        <div class="slide"><img src="photo8.jpeg"></div>
        <div class="slide"><img src="photo9.jpeg"></div>
        <div class="slide"><img src="photo10.jpeg"></div>
        <div class="slide"><img src="photo11.jpeg"></div>

    </div>

</div>

<script>

/* =========================
   CANVAS GALAXY
========================= */

const canvas =
document.getElementById('nebula-bg');

const ctx =
canvas.getContext('2d');

canvas.width =
window.innerWidth;

canvas.height =
window.innerHeight;

const particles = [];

const mouse = {

    x:window.innerWidth/2,
    y:window.innerHeight/2
};

const colors = [

    '#ff9a9e',
    '#fad0c4',
    '#fbc2eb',
    '#a18cd1',
    '#84fab0',
    '#8fd3f4'
];

/* =========================
   PARTICLE CLASS
========================= */

class Particle{

    constructor(){

        this.x =
        Math.random()*canvas.width;

        this.y =
        Math.random()*canvas.height;

        this.size =
        Math.random()*4+1;

        this.speedX =
        (Math.random()-0.5)*1;

        this.speedY =
        (Math.random()-0.5)*1;

        this.color =
        colors[Math.floor(
        Math.random()*colors.length)];

        this.opacity =
        Math.random()*0.8+0.2;
    }

    update(){

        this.x += this.speedX;
        this.y += this.speedY;

        let dx = mouse.x - this.x;
        let dy = mouse.y - this.y;

        let distance =
        Math.sqrt(dx*dx + dy*dy);

        if(distance < 150){

            this.x -= dx*0.002;
            this.y -= dy*0.002;
        }

        if(this.x < 0)
        this.x = canvas.width;

        if(this.x > canvas.width)
        this.x = 0;

        if(this.y < 0)
        this.y = canvas.height;

        if(this.y > canvas.height)
        this.y = 0;
    }

    draw(){

        ctx.beginPath();

        ctx.arc(
        this.x,
        this.y,
        this.size,
        0,
        Math.PI*2);

        ctx.fillStyle =
        this.color;

        ctx.globalAlpha =
        this.opacity;

        ctx.fill();
    }
}

/* =========================
   INIT PARTICLES
========================= */

function initParticles(){

    particles.length = 0;

    for(let i=0;i<600;i++){

        particles.push(
        new Particle());
    }
}

/* =========================
   ANIMATION LOOP
========================= */

function animate(){

    ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height);

    particles.forEach((particle)=>{

        particle.update();
        particle.draw();
    });

    requestAnimationFrame(animate);
}

/* =========================
   EVENTS
========================= */

window.addEventListener(
'mousemove',
(e)=>{

    mouse.x = e.clientX;
    mouse.y = e.clientY;
});

window.addEventListener(
'resize',
()=>{

    canvas.width =
    window.innerWidth;

    canvas.height =
    window.innerHeight;

    initParticles();
});

/* =========================
   3D TILT
========================= */

VanillaTilt.init(

document.querySelectorAll('.slide'),

{
    max:15,
    speed:400,
    glare:true,
    'max-glare':0.4
});

/* =========================
   START
========================= */

initParticles();
animate();

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Mom ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    
    <!-- External Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.7.0/vanilla-tilt.min.js"></script>

    <style>
        /* Base Reset */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Poppins', sans-serif;
            background: #050816;
            overflow-x: hidden;
            color: white;
            line-height: 1.6;
        }

        /* Interactive Background */
        canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -5; pointer-events: none; }
        .stars {
            position: fixed; width: 200%; height: 200%;
            background: url('https://www.transparenttextures.com/patterns/stardust.png');
            animation: moveStars 150s linear infinite;
            opacity: 0.3; z-index: -4;
        }
        @keyframes moveStars { from { transform: translate(0,0); } to { transform: translate(-500px,-500px); } }

        /* Neon Glows */
        .glow { position: fixed; border-radius: 50%; filter: blur(120px); opacity: 0.25; z-index: -3; }
        .glow1 { width: 40vw; height: 40vw; background: #ff4ecd; top: -10vw; left: -10vw; }
        .glow2 { width: 50vw; height: 50vw; background: #4e7dff; bottom: -15vw; right: -15vw; }

        /* Hero Section */
        .hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }
        .hero h1 {
            font-size: clamp(2.2rem, 10vw, 5.5rem);
            font-weight: 800;
            line-height: 1.1;
            background: linear-gradient(135deg, #fff 30%, #ffc0cb 70%, #ffd8c0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
        }
        .hero p { 
            letter-spacing: 4px; 
            color: #d9ddff; 
            font-size: clamp(0.7rem, 2vw, 1rem); 
            text-transform: uppercase;
        }

        /* Responsive Gallery Grid */
        .memory-section { 
            width: 100%; 
            padding: 60px 0; 
            position: relative; 
            z-index: 1; 
        }
        .gallery-grid {
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            /* This line handles the responsiveness automatically */
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            padding: 0 30px;
        }

        /* Memory Cards */
        .memory-card {
            position: relative;
            height: 450px;
            border-radius: 24px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            transition: transform 0.4s ease, box-shadow 0.4s ease;
        }
        .memory-card:hover {
            box-shadow: 0 0 30px rgba(255, 192, 203, 0.4);
        }
        .memory-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s ease;
        }
        .memory-card:hover img { transform: scale(1.08); }

        /* Text Overlay on Cards */
        .overlay {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            padding: 30px 20px;
            background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
            display: flex;
            align-items: flex-end;
        }
        .overlay h2 { font-size: 1.4rem; font-weight: 600; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }

        /* Footer */
        .footer { padding: 100px 20px; text-align: center; }
        .footer h2 { 
            font-size: clamp(1.4rem, 5vw, 2.8rem); 
            font-weight: 700; 
            color: #ffc0cb;
            line-height: 1.5;
        }

        /* Mobile Adjustments */
        @media (max-width: 480px) {
            .gallery-grid { grid-template-columns: 1fr; padding: 0 20px; }
            .memory-card { height: 400px; }
            .hero { padding-top: 80px; }
        }
    </style>
</head>
<body>

    <canvas id="bg"></canvas>
    <div class="stars"></div>
    <div class="glow glow1"></div>
    <div class="glow glow2"></div>

    <section class="hero">
        <h1>Everything I am,<br>I owe to you.</h1>
        <p>TO MY UNIVERSE ❤️</p>
    </section>

  <section class="memory-section">
    <div class="gallery-grid">
        <!-- Adding ./ ensures the browser looks in the current root folder on Vercel -->
        <div class="memory-card"><img src="./photo1.jpeg" alt="Mom"><div class="overlay"><h2>Beautiful Memories</h2></div></div>
        <div class="memory-card"><img src="./photo2.jpeg" alt="Mom"><div class="overlay"><h2>Forever Love</h2></div></div>
        <div class="memory-card"><img src="./photo3.jpeg" alt="Mom"><div class="overlay"><h2>My Happiness</h2></div></div>
        <div class="memory-card"><img src="./photo4.jpeg" alt="Mom"><div class="overlay"><h2>My Strength</h2></div></div>
        <div class="memory-card"><img src="./photo5.jpeg" alt="Mom"><div class="overlay"><h2>Pure Love</h2></div></div>
        <div class="memory-card"><img src="./photo6.jpeg" alt="Mom"><div class="overlay"><h2>Endless Love</h2></div></div>
        <div class="memory-card"><img src="./photo7.jpeg" alt="Mom"><div class="overlay"><h2>Sweet Moments</h2></div></div>
        <div class="memory-card"><img src="./photo8.jpeg" alt="Mom"><div class="overlay"><h2>My World</h2></div></div>
        <div class="memory-card"><img src="./photo9.jpeg" alt="Mom"><div class="overlay"><h2>Always Together</h2></div></div>
        <div class="memory-card"><img src="./photo10.jpeg" alt="Mom"><div class="overlay"><h2>Infinite Love</h2></div></div>
        <div class="memory-card"><img src="./photo11.jpeg" alt="Mom"><div class="overlay"><h2>My Universe</h2></div></div>
    </div>
</section>

    <section class="footer">
        <h2>Thank you for every smile,<br>every sacrifice,<br>and every moment of love ❤️</h2>
    </section>

    <script>
        // --- PARTICLE BACKGROUND ---
        const canvas = document.getElementById("bg");
        const ctx = canvas.getContext("2d");
        let particles = [];
        const colors = ["#ff9a9e", "#fad0c4", "#fbc2eb", "#a18cd1"];

        function init() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            particles = [];
            for (let i = 0; i < 100; i++) particles.push(new Particle());
        }

        class Particle {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 1;
                this.speedX = (Math.random() - 0.5) * 0.4;
                this.speedY = (Math.random() - 0.5) * 0.4;
                this.color = colors[Math.floor(Math.random() * colors.length)];
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) this.reset();
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.globalAlpha = 0.4;
                ctx.fill();
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animate);
        }

        window.addEventListener("resize", init);
        init();
        animate();

        // --- TILT EFFECT ---
        VanillaTilt.init(document.querySelectorAll(".memory-card"), {
            max: 12, speed: 500, glare: true, "max-glare": 0.2
        });

        // --- GSAP SCROLL ANIMATIONS ---
        gsap.registerPlugin(ScrollTrigger);

        gsap.from(".hero h1, .hero p", {
            opacity: 0, y: 30, duration: 1.5, stagger: 0.3, ease: "power2.out"
        });

        // This makes cards appear one by one as you scroll down
        gsap.from(".memory-card", {
            scrollTrigger: {
                trigger: ".gallery-grid",
                start: "top 85%",
            },
            opacity: 0,
            y: 50,
            duration: 0.8,
            stagger: 0.15,
            ease: "power2.out"
        });
    </script>
</body>
</html>

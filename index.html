<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For Mom ❤️</title>

<!-- FONT -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<!-- GSAP -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

<!-- VANILLA TILT -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.7.0/vanilla-tilt.min.js"></script>

<style>

/* =========================
   RESET
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{

    font-family:'Poppins',sans-serif;

    background:#040714;

    color:white;

    overflow-x:hidden;
}

/* =========================
   BACKGROUND
========================= */

canvas{

    position:fixed;

    top:0;
    left:0;

    width:100%;
    height:100%;

    z-index:-5;
}

/* STARS */

.stars{

    position:fixed;

    width:200%;
    height:200%;

    background:
    url('https://www.transparenttextures.com/patterns/stardust.png');

    animation:
    starsMove 150s linear infinite;

    opacity:0.4;

    z-index:-4;
}

@keyframes starsMove{

    from{
        transform:translate(0,0);
    }

    to{
        transform:translate(-500px,-500px);
    }
}

/* GLOW EFFECTS */

.glow{

    position:fixed;

    border-radius:50%;

    filter:blur(120px);

    opacity:0.35;

    z-index:-3;
}

.glow1{

    width:400px;
    height:400px;

    background:#ff4ecd;

    top:-100px;
    left:-100px;

    animation:
    moveGlow1 10s infinite alternate;
}

.glow2{

    width:500px;
    height:500px;

    background:#4e7dff;

    bottom:-120px;
    right:-120px;

    animation:
    moveGlow2 12s infinite alternate;
}

.glow3{

    width:350px;
    height:350px;

    background:#00d4ff;

    top:40%;
    left:45%;

    animation:
    moveGlow3 14s infinite alternate;
}

@keyframes moveGlow1{
    to{
        transform:translate(50px,50px);
    }
}

@keyframes moveGlow2{
    to{
        transform:translate(-60px,-40px);
    }
}

@keyframes moveGlow3{
    to{
        transform:translate(40px,-50px);
    }
}

/* =========================
   HERO SECTION
========================= */

.hero{

    min-height:100vh;

    display:flex;

    justify-content:center;
    align-items:center;

    flex-direction:column;

    text-align:center;

    padding:20px;
}

.hero h1{

    font-size:
    clamp(2.5rem,8vw,7rem);

    font-weight:800;

    line-height:1.2;

    background:
    linear-gradient(
    135deg,
    #ffffff,
    #ffc0cb,
    #ffd8c0);

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;

    text-shadow:
    0 0 20px rgba(255,255,255,0.3);
}

.hero p{

    margin-top:20px;

    color:#d5d8ff;

    letter-spacing:6px;

    font-size:
    clamp(0.9rem,2vw,1.3rem);
}

/* =========================
   GALLERY SECTION
========================= */

.memory-section{

    width:100%;

    padding:50px 20px 100px;
}

/* RESPONSIVE GRID */

.gallery-grid{

    display:grid;

    grid-template-columns:
    repeat(auto-fit,minmax(260px,1fr));

    gap:35px;

    width:100%;

    max-width:1500px;

    margin:auto;

    justify-items:center;
}

/* CARD */

.memory-card{

    width:100%;

    max-width:300px;

    height:420px;

    border-radius:30px;

    overflow:hidden;

    position:relative;

    background:
    rgba(255,255,255,0.08);

    backdrop-filter:blur(10px);

    border:
    1px solid rgba(255,255,255,0.1);

    box-shadow:
    0 15px 40px rgba(0,0,0,0.5);

    transition:0.5s ease;

    animation:
    floating 5s ease-in-out infinite;
}

/* HOVER */

.memory-card:hover{

    transform:
    translateY(-15px)
    scale(1.03);

    box-shadow:
    0 0 60px rgba(255,192,203,0.5);
}

/* IMAGE */

.memory-card img{

    width:100%;
    height:100%;

    object-fit:cover;
}

/* OVERLAY */

.overlay{

    position:absolute;

    inset:0;

    background:
    linear-gradient(
    to top,
    rgba(0,0,0,0.85),
    transparent 55%);

    display:flex;

    align-items:flex-end;

    padding:20px;
}

.overlay h2{

    font-size:1.5rem;

    font-weight:700;
}

/* FLOAT */

@keyframes floating{

    0%{
        transform:translateY(0px);
    }

    50%{
        transform:translateY(-10px);
    }

    100%{
        transform:translateY(0px);
    }
}

/* =========================
   FOOTER
========================= */

.footer{

    padding:100px 20px;

    text-align:center;
}

.footer h2{

    font-size:
    clamp(1.8rem,5vw,4rem);

    line-height:1.5;
}

/* =========================
   TABLET
========================= */

@media(max-width:900px){

    .gallery-grid{

        grid-template-columns:
        repeat(2,1fr);
    }

    .memory-card{

        max-width:100%;
        height:350px;
    }
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    .hero{

        min-height:80vh;
    }

    .hero h1{

        font-size:2.8rem;
    }

    .hero p{

        letter-spacing:3px;
    }

    .gallery-grid{

        grid-template-columns:1fr;

        gap:25px;
    }

    .memory-card{

        width:90%;

        max-width:340px;

        height:420px;
    }

    .overlay h2{

        font-size:1.3rem;
    }

    .footer{

        padding:70px 20px;
    }
}

</style>

</head>

<body>

<!-- BACKGROUND -->

<canvas id="bg"></canvas>

<div class="stars"></div>

<div class="glow glow1"></div>
<div class="glow glow2"></div>
<div class="glow glow3"></div>

<!-- HERO -->

<section class="hero">

    <h1>
        Everything I am,<br>
        I owe to you.
    </h1>

    <p>TO MY UNIVERSE ❤️</p>

</section>

<!-- GALLERY -->

<section class="memory-section">

    <div class="gallery-grid">

        <div class="memory-card">
            <img src="photo1.jpeg">
            <div class="overlay">
                <h2>Beautiful Memories</h2>
            </div>
        </div>

        <div class="memory-card">
            <img src="photo2.jpeg">
            <div class="overlay">
                <h2>Forever Love</h2>
            </div>
        </div>

        <div class="memory-card">
            <img src="photo3.jpeg">
            <div class="overlay">
                <h2>My Happiness</h2>
            </div>
        </div>

        <div class="memory-card">
            <img src="photo4.jpeg">
            <div class="overlay">
                <h2>My Strength</h2>
            </div>
        </div>

        <div class="memory-card">
            <img src="photo5.jpeg">
            <div class="overlay">
                <h2>Pure Love</h2>
            </div>
        </div>

        <div class="memory-card">
            <img src="photo6.jpeg">
            <div class="overlay">
                <h2>Endless Care</h2>
            </div>
        </div>

        <div class="memory-card">
            <img src="photo7.jpeg">
            <div class="overlay">
                <h2>Sweet Moments</h2>
            </div>
        </div>

        <div class="memory-card">
            <img src="photo8.jpeg">
            <div class="overlay">
                <h2>My World</h2>
            </div>
        </div>

        <div class="memory-card">
            <img src="photo9.jpeg">
            <div class="overlay">
                <h2>Always Together</h2>
            </div>
        </div>

        <div class="memory-card">
            <img src="photo10.jpeg">
            <div class="overlay">
                <h2>Infinite Love</h2>
            </div>
        </div>

        <div class="memory-card">
            <img src="photo11.jpeg">
            <div class="overlay">
                <h2>My Universe</h2>
            </div>
        </div>

    </div>

</section>

<!-- FOOTER -->

<section class="footer">

    <h2>
        Thank you for every smile,<br>
        every sacrifice,<br>
        and every moment of love ❤️
    </h2>

</section>

<script>

/* =========================
   PARTICLE BACKGROUND
========================= */

const canvas =
document.getElementById("bg");

const ctx =
canvas.getContext("2d");

canvas.width =
window.innerWidth;

canvas.height =
window.innerHeight;

const particles = [];

const colors = [

    "#ff9a9e",
    "#fad0c4",
    "#fbc2eb",
    "#a18cd1",
    "#84fab0",
    "#8fd3f4"
];

class Particle{

    constructor(){

        this.x =
        Math.random()*canvas.width;

        this.y =
        Math.random()*canvas.height;

        this.size =
        Math.random()*3+1;

        this.speedX =
        (Math.random()-0.5)*0.8;

        this.speedY =
        (Math.random()-0.5)*0.8;

        this.color =
        colors[Math.floor(
        Math.random()*colors.length)];

        this.opacity =
        Math.random()*0.8+0.2;
    }

    update(){

        this.x += this.speedX;
        this.y += this.speedY;

        if(this.x < 0)
        this.x = canvas.width;

        if(this.x > canvas.width)
        this.x = 0;

        if(this.y < 0)
        this.y = canvas.height;

        if(this.y > canvas.height)
        this.y = 0;
    }

    draw(){

        ctx.beginPath();

        ctx.arc(
        this.x,
        this.y,
        this.size,
        0,
        Math.PI*2);

        ctx.fillStyle =
        this.color;

        ctx.globalAlpha =
        this.opacity;

        ctx.fill();
    }
}

function initParticles(){

    for(let i=0;i<400;i++){

        particles.push(
        new Particle());
    }
}

function animate(){

    ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height);

    particles.forEach((particle)=>{

        particle.update();
        particle.draw();
    });

    requestAnimationFrame(animate);
}

/* RESIZE */

window.addEventListener(
"resize",
()=>{

    canvas.width =
    window.innerWidth;

    canvas.height =
    window.innerHeight;
});

/* TILT EFFECT */

VanillaTilt.init(

document.querySelectorAll(".memory-card"),

{
    max:10,
    speed:400,
    glare:true,
    "max-glare":0.2
});

/* GSAP */

gsap.from(".hero h1",{

    opacity:0,
    y:80,
    duration:1.5
});

gsap.from(".hero p",{

    opacity:0,
    y:40,
    duration:1.5,
    delay:0.3
});

gsap.from(".memory-card",{

    opacity:0,
    y:100,
    duration:1,
    stagger:0.1
});

/* START */

initParticles();
animate();

</script>

</body>
</html>
